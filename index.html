<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio poétique — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #15130f;
    --panel: #1c1a15;
    --ink: #f2ecdf;
    --ink-dim: #a9a191;
    --gold: #c9a463;
    --gold-dim: rgba(201,164,99,0.35);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ---------- écran d'entrée ---------- */

  #intro{
    position: fixed; inset:0; z-index: 50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 2.4rem;
    background: var(--bg);
    transition: opacity 1.4s ease;
  }

  #intro.hidden{ opacity:0; pointer-events:none; }

  #intro .name{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    font-weight: 400;
  }

  #intro .line{
    width: 1px; height: 40px;
    background: var(--gold-dim);
  }

  #enter-btn{
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--gold-dim);
    padding: 0.9rem 1.8rem;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .4s ease, background .4s ease;
  }

  #enter-btn:hover{ border-color: var(--gold); background: rgba(201,164,99,0.08); }

  #intro .hint{
    font-size: 0.75rem;
    color: var(--ink-dim);
    opacity: 0.6;
  }

  /* ---------- scène principale ---------- */

  #stage{
    position: fixed; inset:0;
    height: 100vh; width: 100vw;
  }

  .piece{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition: opacity .9s ease;
  }

  .piece.active{ opacity:1; visibility:visible; }

  .photo{
    position:absolute; inset:0;
    opacity:0;
    transition: opacity 2.6s ease;
  }

  .piece.reveal-photo .photo{ opacity:1; }

  .scrim{
    position:absolute; inset:0;
    background: linear-gradient(to top,
      rgba(10,9,7,0.72) 0%,
      rgba(10,9,7,0.38) 32%,
      rgba(10,9,7,0) 60%);
    opacity:0;
    transition: opacity 1.6s ease;
  }

  .piece.reveal-poem .scrim{ opacity:1; }

  .poem-wrap{
    position:relative; z-index:3;
    max-width: 620px;
    padding: 0 2rem;
    text-align:center;
  }

  .poem{
    font-family:'Cormorant Garamond', serif;
    font-size: clamp(1.3rem, 2.4vw, 1.85rem);
    line-height: 1.85;
    font-weight: 400;
    color: var(--ink);
    text-shadow: 0 1px 22px rgba(0,0,0,0.75), 0 1px 4px rgba(0,0,0,0.9);
  }

  .poem .l{
    display:block;
    opacity:0;
    transform: translateY(10px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }

  .piece.reveal-poem .poem .l{ opacity:1; transform: translateY(0); }
  .poem .l:nth-child(1){ transition-delay: 0s; }
  .poem .l:nth-child(2){ transition-delay: .25s; }
  .poem .l:nth-child(3){ transition-delay: .5s; }
  .poem .l:nth-child(4){ transition-delay: .75s; }

  .emotion{
    margin-top: 1.6rem;
    font-family:'Inter', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: var(--gold);
    opacity:0;
    text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    transition: opacity 1.4s ease 1s;
  }

  .piece.reveal-poem .emotion{ opacity: 0.85; }

  /* ---------- mini-écran (miniature photo) ---------- */

  .thumb{
    position:absolute; z-index:4;
    bottom: 92px; left: 28px;
    width: 54px; height: 54px;
    border-radius: 6px;
    border: 1px solid rgba(242,236,223,0.25);
    cursor: pointer;
    overflow:hidden;
    opacity:0;
    transition: opacity 1s ease 1.6s, border-color .3s ease, transform .3s ease;
  }

  .piece.reveal-photo .thumb{ opacity:1; }
  .thumb:hover{ border-color: var(--gold); transform: scale(1.05); }

  .thumb::after{
    content:"";
    position:absolute; inset:0;
    background: rgba(0,0,0,0.15);
  }

  .thumb-icon{
    position:absolute; bottom:4px; right:4px; z-index:2;
    width:14px; height:14px;
    opacity: 0.85;
  }

  /* ---------- modale photo plein écran ---------- */

  #photo-modal{
    position:fixed; inset:0; z-index: 60;
    display:flex; align-items:center; justify-content:center;
    background: rgba(8,7,5,0.92);
    opacity:0; visibility:hidden;
    transition: opacity .4s ease;
  }

  #photo-modal.open{ opacity:1; visibility:visible; }

  #photo-modal .full-photo{
    width: min(92vw, 1100px);
    height: min(86vh, 720px);
    border-radius: 4px;
  }

  #photo-modal .close-btn{
    position:absolute; top: 24px; right: 28px;
    width:36px; height:36px;
    border-radius:50%;
    border: 1px solid rgba(242,236,223,0.25);
    background: transparent;
    color: var(--ink);
    font-size: 1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .3s ease;
  }

  #photo-modal .close-btn:hover{ border-color: var(--gold); }

  /* ---------- navigation ---------- */

  #dots{
    position:fixed; right: 22px; top:50%; z-index: 10;
    transform: translateY(-50%);
    display:flex; flex-direction:column; gap:10px;
  }

  #dots .dot{
    width:6px; height:6px; border-radius:50%;
    background: rgba(242,236,223,0.25);
    cursor:pointer;
    transition: all .3s ease;
  }

  #dots .dot.active{
    background: var(--gold);
    height:16px; border-radius:3px;
  }

  #brand{
    position:fixed; top: 26px; left: 28px; z-index:10;
    font-size: 0.7rem; letter-spacing:0.06em;
    color: var(--ink-dim);
  }

  /* ---------- menu / index des pièces ---------- */

  #menu-btn{
    position:fixed; top: 24px; right: 28px; z-index: 20;
    width:32px; height:32px;
    background:transparent; border:none; cursor:pointer;
  }

  #menu-btn .ln{
    position:absolute; right:6px;
    height:1px; width:20px;
    background: var(--ink-dim);
    transition: all .3s ease;
  }
  #menu-btn .ln:nth-child(1){ top:13px; }
  #menu-btn .ln:nth-child(2){ top:19px; width:14px; }
  #menu-btn:hover .ln{ background: var(--gold); }

  #menu-btn.is-open .ln:nth-child(1){ top:16px; width:20px; transform: rotate(45deg); }
  #menu-btn.is-open .ln:nth-child(2){ top:16px; width:20px; transform: rotate(-45deg); }
  #menu-btn.is-open .ln{ background: var(--gold); }

  #index-panel{
    position:fixed; inset:0; z-index:40;
    background: var(--bg);
    opacity:0; visibility:hidden;
    transition: opacity .5s ease;
    overflow-y:auto;
    padding: 100px 8vw 60px;
  }

  #index-panel.open{ opacity:1; visibility:visible; }

  #index-panel .entry{
    display:flex; align-items:center; gap: 22px;
    padding: 20px 0;
    border-top: 1px solid rgba(242,236,223,0.1);
    cursor:pointer;
  }

  #index-panel .entry:last-child{ border-bottom: 1px solid rgba(242,236,223,0.1); }

  #index-panel .swatch{
    width:52px; height:52px; border-radius:4px; flex-shrink:0;
  }

  #index-panel .meta{ flex:1; }

  #index-panel .entry-title{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.3rem; color: var(--ink);
    transition: color .3s ease;
  }

  #index-panel .entry:hover .entry-title{ color: var(--gold); }

  #index-panel .entry-emotion{
    font-size: 0.72rem; color: var(--ink-dim);
    margin-top: 4px;
  }

  #index-panel .entry-num{
    font-size: 0.7rem; color: var(--ink-dim);
    width: 28px;
  }

  /* ---------- barre musique ---------- */

  #music-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding: 16px 28px;
    display:flex; align-items:center; gap:14px;
    background: linear-gradient(to top, rgba(8,7,5,0.55) 0%, transparent 100%);
  }

  #play-btn{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--gold-dim);
    background: rgba(201,164,99,0.06);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  #play-btn.disabled{ opacity: 0.35; cursor: default; }

  #play-btn .tri{
    width:0; height:0;
    border-style:solid; border-width:5px 0 5px 8px;
    border-color: transparent transparent transparent var(--ink);
    margin-left:2px;
  }

  #play-btn .bars{
    display:none; gap:3px;
  }

  #play-btn.playing .tri{ display:none; }
  #play-btn.playing .bars{ display:flex; }

  #play-btn .bar{ width:3px; height:11px; background: var(--ink); }

  #track-label{
    font-size: 0.72rem; letter-spacing:0.03em;
    color: var(--ink-dim);
    white-space:nowrap;
  }

  #yt-player{
    position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;
  }

  .sr-only{
    position:absolute; width:1px;height:1px;
    overflow:hidden; clip:rect(0,0,0,0);
  }

</style>
</head>
<body>

<h1 class="sr-only">Portfolio poétique — prototype d'expérience photo, poème et musique</h1>

<!-- écran d'entrée : nécessaire pour autoriser la lecture audio dans le navigateur -->
<div id="intro">
  <p class="name">Empreintes – by Siri</p>
  <div class="line"></div>
  <button id="enter-btn">entrer dans l'expérience</button>
  <p class="hint">le son démarre à l'entrée</p>
</div>

<div id="brand">Empreintes – by Siri</div>
<div id="dots"></div>

<button id="menu-btn" aria-label="Ouvrir la liste des pièces">
  <div class="ln"></div>
  <div class="ln"></div>
</button>

<div id="index-panel"></div>

<div id="stage"></div>

<div id="photo-modal">
  <button class="close-btn" aria-label="Fermer">✕</button>
  <div class="full-photo"></div>
</div>

<div id="music-bar">
  <button id="play-btn" aria-label="Lecture / pause">
    <div class="tri"></div>
    <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
  </button>
  <span id="track-label">musique à venir</span>
</div>

<div id="yt-player"></div>

<script>

/* ==========================================================
   DONNÉES DES PIÈCES
   Remplace ces 3 exemples par tes propres photos, poèmes,
   émotions et — quand tu les auras — tes IDs de vidéos YouTube.

   photo : dégradé de remplacement pour l'instant.
     -> pour mettre ta vraie photo, remplace la valeur par :
        "url('chemin-vers-ta-photo.jpg') center/cover no-repeat"
   youtubeId : laisse vide "" tant que tu n'as pas de musique.
     -> sinon, colle l'ID de la vidéo YouTube (ce qui suit "v=" dans l'URL)
========================================================== */

const pieces = [
  {
    photo: "radial-gradient(circle at 70% 30%, rgba(90,70,50,0.35), transparent 60%), linear-gradient(160deg, #362c22 0%, #1b1712 55%, #10141a 100%)",
    poem: [
Laying on the grass,¶
Watching up there.¶
Sun is changing path,¶
Feeling the nightmare?¶
¶
Enter the bubble,¶
Feeling dizzy.¶
My sense is purple,¶
Feeling lonely.¶
    ],
    title: "Ce qui ne revient pas",
    emotion: "Sumire Murasaki",
    youtubeId: "",
    trackTitle: "musique à venir"
  },
  {
    photo: "radial-gradient(circle at 30% 70%, rgba(50,70,80,0.4), transparent 60%), linear-gradient(150deg, #14201f 0%, #0f1a22 55%, #1a1512 100%)",
    poem: [
      "Le silence n'est pas un vide,",
      "c'est une pièce que le vent traverse.",
      "J'y ai laissé une fenêtre ouverte",
      "pour que tu saches où me trouver."
    ],
    title: "La fenêtre ouverte",
    emotion: "attente",
    youtubeId: "",
    trackTitle: "musique à venir"
  },
  {
    photo: "radial-gradient(circle at 60% 40%, rgba(90,50,60,0.35), transparent 60%), linear-gradient(155deg, #2a1a1c 0%, #191014 55%, #0f1015 100%)",
    poem: [
      "On ne rentre jamais tout à fait",
      "du pays de ce qu'on a perdu.",
      "Mais on apprend à porter la porte",
      "sur soi, comme un vêtement léger."
    ],
    title: "Porter la porte",
    emotion: "deuil doux",
    youtubeId: "",
    trackTitle: "musique à venir"
  }
];

/* ========================================================== */

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');

let current = 0;
let ytPlayer = null;
let ytReady = false;
let isPlaying = false;

function buildStage(){
  pieces.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'piece';
    el.dataset.index = i;

    const photo = document.createElement('div');
    photo.className = 'photo';
    photo.style.background = p.photo;

    const scrim = document.createElement('div');
    scrim.className = 'scrim';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.background = p.photo;
    thumb.title = 'Voir la photo en grand';
    thumb.innerHTML = '<svg class="thumb-icon" viewBox="0 0 16 16" fill="none"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" stroke="#f2ecdf" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    thumb.addEventListener('click', () => openModal(i));

    const wrap = document.createElement('div');
    wrap.className = 'poem-wrap';
    const poemEl = document.createElement('p');
    poemEl.className = 'poem';
    p.poem.forEach(line => {
      const l = document.createElement('span');
      l.className = 'l';
      l.textContent = line;
      poemEl.appendChild(l);
    });
    const emo = document.createElement('p');
    emo.className = 'emotion';
    emo.textContent = p.emotion;

    wrap.appendChild(poemEl);
    wrap.appendChild(emo);

    el.appendChild(photo);
    el.appendChild(scrim);
    el.appendChild(thumb);
    el.appendChild(wrap);
    stage.appendChild(el);

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(dot);
  });
  updateChrome();
}

function updateChrome(){
  document.querySelectorAll('#dots .dot').forEach((d,i) => d.classList.toggle('active', i===current));
}

function playSequence(index){
  const el = stage.children[index];
  el.classList.remove('reveal-photo','reveal-poem');
  void el.offsetWidth; // reset des transitions
  requestAnimationFrame(() => {
    el.classList.add('reveal-photo');
    setTimeout(() => el.classList.add('reveal-poem'), 2600);
  });
}

function goTo(index){
  if(index === current) { return; }
  stage.children[current].classList.remove('active');
  current = index;
  const el = stage.children[current];
  el.classList.add('active');
  updateChrome();
  playSequence(current);
  loadTrack(pieces[current]);
}

/* ---------- index des pièces ---------- */

const menuBtn = document.getElementById('menu-btn');
const indexPanel = document.getElementById('index-panel');

function buildIndexPanel(){
  pieces.forEach((p, i) => {
    const entry = document.createElement('div');
    entry.className = 'entry';

    const num = document.createElement('span');
    num.className = 'entry-num';
    num.textContent = String(i+1).padStart(2,'0');

    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = p.photo;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<p class="entry-title">' + (p.title || 'Sans titre') + '</p>' +
                      '<p class="entry-emotion">' + p.emotion + '</p>';

    entry.appendChild(num);
    entry.appendChild(swatch);
    entry.appendChild(meta);
    entry.addEventListener('click', () => {
      goTo(i);
      closeIndexPanel();
    });
    indexPanel.appendChild(entry);
  });
}

function openIndexPanel(){
  indexPanel.classList.add('open');
  menuBtn.classList.add('is-open');
  menuBtn.setAttribute('aria-label', 'Fermer la liste des pièces');
}
function closeIndexPanel(){
  indexPanel.classList.remove('open');
  menuBtn.classList.remove('is-open');
  menuBtn.setAttribute('aria-label', 'Ouvrir la liste des pièces');
}

menuBtn.addEventListener('click', () => {
  indexPanel.classList.contains('open') ? closeIndexPanel() : openIndexPanel();
});

/* ---------- modale photo ---------- */

const modal = document.getElementById('photo-modal');
const modalPhoto = modal.querySelector('.full-photo');
const closeBtn = modal.querySelector('.close-btn');

function openModal(index){
  modalPhoto.style.background = pieces[index].photo;
  modal.classList.add('open');
}
function closeModal(){ modal.classList.remove('open'); }

closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(indexPanel.classList.contains('open')) closeIndexPanel();
    else closeModal();
  }
});

/* ---------- navigation clavier / molette ---------- */

let wheelLock = false;
window.addEventListener('wheel', (e) => {
  if(document.getElementById('intro').classList.contains('hidden') === false) return;
  if(indexPanel.classList.contains('open')) return;
  if(wheelLock) return;
  if(Math.abs(e.deltaY) < 30) return;
  wheelLock = true;
  if(e.deltaY > 0 && current < pieces.length-1) goTo(current+1);
  else if(e.deltaY < 0 && current > 0) goTo(current-1);
  setTimeout(() => wheelLock = false, 900);
});

document.addEventListener('keydown', (e) => {
  if(indexPanel.classList.contains('open')) return;
  if(e.key === 'ArrowDown' && current < pieces.length-1) goTo(current+1);
  if(e.key === 'ArrowUp' && current > 0) goTo(current-1);
});

/* ---------- musique (API YouTube) ---------- */

const playBtn = document.getElementById('play-btn');
const trackLabel = document.getElementById('track-label');

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('yt-player', {
    height: '1', width: '1',
    playerVars: { autoplay: 0, controls: 0 },
    events: {
      onReady: () => { ytReady = true; }
    }
  });
}

function loadTrack(piece){
  trackLabel.textContent = piece.trackTitle || 'musique à venir';
  if(!piece.youtubeId){
    playBtn.classList.add('disabled');
    playBtn.classList.remove('playing');
    isPlaying = false;
    if(ytReady) ytPlayer.stopVideo();
    return;
  }
  playBtn.classList.remove('disabled');
  if(ytReady){
    ytPlayer.cueVideoById(piece.youtubeId);
  }
}

playBtn.addEventListener('click', () => {
  const piece = pieces[current];
  if(!piece.youtubeId || !ytReady) return;
  if(isPlaying){
    ytPlayer.pauseVideo();
    playBtn.classList.remove('playing');
    isPlaying = false;
  } else {
    ytPlayer.playVideo();
    playBtn.classList.add('playing');
    isPlaying = true;
  }
});

/* ---------- démarrage ---------- */

const intro = document.getElementById('intro');
document.getElementById('enter-btn').addEventListener('click', () => {
  intro.classList.add('hidden');
  stage.children[0].classList.add('active');
  loadTrack(pieces[0]);
  // tente de lancer la musique dès l'entrée (nécessite le geste utilisateur, présent ici)
  setTimeout(() => {
    if(pieces[0].youtubeId && ytReady){
      ytPlayer.playVideo();
      playBtn.classList.add('playing');
      isPlaying = true;
    }
  }, 300);
  playSequence(0);
});

buildStage();
buildIndexPanel();

</script>
</body>
</html>
